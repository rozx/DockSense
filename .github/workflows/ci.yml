name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DockSense.slnx

      - name: Build
        run: dotnet build DockSense.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/DockSense.Core.Tests -c Release --no-build --logger "console;verbosity=normal"
