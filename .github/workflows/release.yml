name: Release

# Push a tag like v0.2.0 to build single-file executables and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DockSense.Core.Tests -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/DockSense.App -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=$version -o "publish/$rid"
            Copy-Item LICENSE "publish/$rid/"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "DockSense-$version-$rid.zip"
          }

      - uses: softprops/action-gh-release@v2
        with:
          files: DockSense-*.zip
          generate_release_notes: true
