name: Release

# A release is published only when ALL of these are true:
#   1. a pull request into main is merged (not just closed),
#   2. its source branch is named release/v<major>.<minor>[.<patch>] (e.g. release/v0.2 or release/v1.2.3),
#   3. the pull request has the "release" label.
# The version comes from the branch name; the tag v<version> is created on the merge commit.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read the version from the branch name
        id: version
        shell: pwsh
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if ($env:BRANCH -notmatch '^release/v(\d+\.\d+(\.\d+)?)$') {
            throw "Branch '$env:BRANCH' must be named release/v<major>.<minor> or release/v<major>.<minor>.<patch>"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing DockSense $version"

      # The release description is the CHANGELOG.md section for this version (CI checks it exists on release PRs);
      # GitHub's generated list of merged pull requests is appended below it.
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: ./.github/scripts/Get-ReleaseNotes.ps1 -Version $env:VERSION -RepositoryUrl $env:REPOSITORY_URL -OutFile release-notes.md

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DockSense.Core.Tests -c Release

      - name: Publish single-file builds
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish src/DockSense.App -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=$env:VERSION -o "publish/$rid"
            Copy-Item LICENSE "publish/$rid/"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "DockSense-$env:VERSION-$rid.zip"
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: DockSense v${{ steps.version.outputs.version }}
          files: DockSense-*.zip
          body_path: release-notes.md
          generate_release_notes: true
